[project]
name = "bespoke-factory"
version = "0.1.0"
description = "Agentic factory that turns a task into a reproducible workflow, with an LLM only where one is needed"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "mcp>=2.3",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "bandit[toml]"]
ui = ["streamlit>=1.37"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/fixtures"  # fixture repos have their own (deliberately failing) tests
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures", "bench/repos", "bench/hidden"]  # deliberately buggy code, and tests run inside it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # long lines are left to judgment
    "E741",  # short names like l are fine in small helpers
    "S101",  # assert is how pytest checks
    "S603",  # subprocess with argument lists is how the sandbox runs tests and git
    "S607",  # git and python are found on PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures and then name them as arguments, and keep patch text with blank context lines.
"tests/*" = ["F811", "S", "W293"]
# Field() defaults are how MCP tools describe their arguments.
"factory/mcp/server.py" = ["B008"]

[tool.bandit]
exclude_dirs = ["tests"]
# Running git and pytest with argument lists is the sandbox's job (same calls Ruff's S603/S607 allow above).
skips = ["B404", "B603", "B607", "B405"]
