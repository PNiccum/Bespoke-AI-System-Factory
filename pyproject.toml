[project]
name = "bespoke-factory"
version = "0.1.0"
description = "Agentic factory that turns a task into a reproducible workflow, with an LLM only where one is needed"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
