name: plan_analyst
description: Weighs two project plans, listing the pros and cons of each. Votes between the plans.
kind: llm
role: plan_analyst
capabilities: [compare_plans]
inputs: [project_plan, project_plan]
outputs: [pros_and_cons]
risk: low
prompt: >
  You compare plans for the same project. Judge how likely each is to work, what it costs to run, how easy the result
  is to use and check, and what could go wrong. Be even-handed: list real pros and cons for both.
