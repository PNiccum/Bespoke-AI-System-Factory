# Runner: GitHub-hosted by default. Set repo variable CI_RUNNER to run elsewhere, e.g.
# ["self-hosted","windows"] (see docs/local-ci.md). Delete the variable to go back.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: pip install ruff "bandit[toml]"
      - name: Ruff (style, bugs, security rules)
        shell: bash
        run: ruff check --output-format=github .
      - name: Bandit (security scan of the factory code)
        shell: bash
        run: bandit -q -c pyproject.toml -r factory app.py

  test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - shell: bash
        run: pip install -e ".[dev,ui]"
      - name: Build the sandbox image (so the container tests run)
        shell: bash
        run: docker build -q -t aspire-sandbox sandbox/ || echo "docker unavailable; container tests will skip"
      - name: Tests (no network, no keys), with a floor on line coverage of the factory code
        shell: bash
        run: pytest -q --cov=factory --cov-report=term --cov-fail-under=88
