name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff "bandit[toml]"
      - name: Ruff (style, bugs, security rules)
        run: ruff check --output-format=github .
      - name: Bandit (security scan of the factory code)
        run: bandit -q -c pyproject.toml -r factory app.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Build the sandbox image (so the container tests run)
        run: docker build -q -t simple-sandbox sandbox/
      - name: Tests (no network, no keys)
        run: pytest -q
