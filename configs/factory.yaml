# The factory's default deployment: ARC models first, paid models only on escalation and with approval.
# Keys come from environment variables (see .env.example); never put a key in this file.
name: factory
description: >
  Bespoke AI System Factory: turns a task into a reproducible workflow, exported as a code bundle,
  with an LLM only at the steps that need one.

# The class demo uses public example data only, so inputs may go to Claude or OpenAI once approved.
data_public: true

providers:
  arc:
    format: anthropic        # Bespoke_LLM called the ARC gateway in Messages format
    base_url: https://llm-api.arc.vt.edu/api
    api_key_env: ARC_API_KEY
    max_concurrency: 8       # ARC allows 20 in-flight requests per user
  claude:
    format: anthropic        # Claude API
    api_key_env: ANTHROPIC_API_KEY
    data_scope: public_only
    prompt_caching: true     # agent turns re-send their history; cached input costs a tenth
    batch: true              # Message Batches for non-interactive calls: half price
  openai:
    format: openai
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
    token_param: max_completion_tokens
    batch: true
    data_scope: public_only

# Every role starts on a free ARC model. `quality` is the paid escalation step, taken only when the free model's
# output fails its check, and only after a person approves the spend.
# Family separation: authors use GLM, then OpenAI; reviewers use DeepSeek, then Claude. No reviewer can ever share a
# family with an author, in either tier.
tier: economy

# Plain-code agents (code_navigator, test_runner) run in the factory's MCP server (python -m factory.mcp), a
# separate process with no keys in its environment. "direct" calls them in-process instead.
tool_transport: mcp

# Where generated code's tests run. "process" works everywhere; "docker"/"podman" (build sandbox/Dockerfile as
# aspire-sandbox) adds no network, no keys, a read-only root and resource caps; "apptainer" takes a .sif image on ARC.
# ASPIRE_SANDBOX=docker in the environment overrides this for one run.
sandbox:
  runner: process
  image: aspire-sandbox
role_tiers: {}

roles:
  # GLM was the only ARC model to finish Bespoke_LLM's agent-driver probe.
  # fallbacks: free models on ARC tried in order when the first is down or renamed; they count toward family
  # separation like any other model the role can use.
  planner:  {provider: arc, model: GLM-5.3-thinking-high, kind: author, fallbacks: [GLM-5.3, gpt-oss-120b-thinking-high]}
  agent:    {provider: arc, model: GLM-5.3-thinking-high, kind: author, fallbacks: [GLM-5.3, gpt-oss-120b-thinking-high]}
  # The planning loop (factory/pipeline/planning.py) puts three families on one plan: the planner (GLM) wrote Plan A
  # and edits, plan_critic (DeepSeek) critiques it and writes Plan B, plan_analyst (gpt-oss) weighs the two. Their
  # fallbacks stay inside their own family, so the three never collapse into one.
  plan_critic:  {provider: arc, model: DeepSeek-V4.1-Flash-thinking-max, fallbacks: [DeepSeek-V4.1-Flash-thinking-low, DeepSeek-V4.1-Flash]}
  plan_analyst: {provider: arc, model: gpt-oss-120b-thinking-high, fallbacks: [gpt-oss-120b-thinking-low, gpt-oss-120b]}
  coder:
    provider: arc
    model: GLM-5.3-thinking-high
    kind: author
    fallbacks: [GLM-5.3, gpt-oss-120b-thinking-high]
    quality: {provider: openai, model: gpt-6.1-sol, max_tokens: 16000}
  reviewer:
    provider: arc
    model: DeepSeek-V4.1-Flash-thinking-max
    kind: reviewer
    fallbacks: [DeepSeek-V4.1-Flash-thinking-low, DeepSeek-V4.1-Flash]
    max_tokens: 64000
    quality: {provider: claude, model: claude-sonnet-5-5, max_tokens: 16000}

budget:
  approve_above_usd: 1.00   # a paid call that would take a run past $1 waits for approval
  max_real_usd: 3.00        # hard stop for one run

# Paid credit on hand (2026-10-28). $10 is held back for rehearsals and the Dec 3 showcase.
credits:
  by_provider: {claude: 20.00, openai: 15.00}
  reserve_usd: 10.00

agent_caps:
  max_steps: 40
  max_real_usd: 1.00
